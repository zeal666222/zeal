version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      radix:
        patterns: ["@radix-ui/*"]
      react:
        patterns: ["react*", "@types/react*"]
      next:
        patterns: ["next", "eslint-config-next"]
      tanstack:
        patterns: ["@tanstack/*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
