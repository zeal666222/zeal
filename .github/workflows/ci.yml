name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  type-check:
    name: Type-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
      - name: Type-check packages
        run: |
          for ws in packages/types packages/utils packages/ui packages/database packages/realtime; do
            echo "→ $ws"
            npm run type-check --workspace="$ws" --if-present || exit 1
          done
      - name: Type-check apps
        run: |
          npm run type-check --workspace=web
          npm run type-check --workspace=admin

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: type-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci --legacy-peer-deps
