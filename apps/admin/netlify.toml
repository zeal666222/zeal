# ═══════════════════════════════════════════════════════════════════════════════
# ZEAL ADMIN — Netlify Configuration (monorepo-safe)
# ─────────────────────────────────────────────────────────────────────────────
# CRITICAL: no `base =` key. Netlify UI must have:
#   Base directory    : (empty/unset)
#   Package directory : apps/admin
# ═══════════════════════════════════════════════════════════════════════════════

[build]
  command = "npm install --legacy-peer-deps && npm run build --workspace=admin"
  publish = "apps/admin/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"

# ─── Security headers (stricter for admin) ────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

# ─── API PROXY: forward /api/* to the web app ─────────────────────────────────
[[redirects]]
  from = "/api/*"
  to = "https://zeal-web.netlify.app/api/:splat"
  status = 200
  force = true
