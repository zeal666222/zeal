# ═══════════════════════════════════════════════════════════════════════════════
# ZEAL WEB — Netlify Configuration (monorepo-safe)
# ─────────────────────────────────────────────────────────────────────────────
# CRITICAL: no `base =` key. Netlify UI must have:
#   Base directory    : (empty/unset)
#   Package directory : apps/web
#
# This is required because the Next.js runtime v5 adapter cannot resolve
# hoisted `next` from node_modules when base is set to a subdirectory in
# an npm workspaces monorepo.
# ═══════════════════════════════════════════════════════════════════════════════

[build]
  command = "npm install --legacy-peer-deps && npm run build --workspace=web"
  publish = "apps/web/.next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"
  NEXT_TELEMETRY_DISABLED = "1"

# Cron functions live under apps/web/netlify/functions
[functions]
  directory = "apps/web/netlify/functions"
  node_bundler = "esbuild"

# ─── Security headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

# ─── Redirects ────────────────────────────────────────────────────────────────
[[redirects]]
  from = "/auth/login"
  to = "/login"
  status = 301

[[redirects]]
  from = "/auth/register"
  to = "/register"
  status = 301

[[redirects]]
  from = "/ai-consultants"
  to = "/ai-astrologers"
  status = 301

[[redirects]]
  from = "/quests"
  to = "/sparks"
  status = 302

[[redirects]]
  from = "/referral"
  to = "/sparks"
  status = 302

[[redirects]]
  from = "/bazaar"
  to = "/explore"
  status = 302
